  - cve: CVE-2026-47838
    upstream_fix_url: https://github.com/spring-projects/spring-security/commit/e3ad551ab337d8a1e17217994b45fed6c68ce69e
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-47838
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-spring-security/commit/bcf97e3
    basis: adapted
    artifacts:
      - org.springframework.security:spring-security-web
    note: "Carried from 5.7.14.1-backpatch-00008; ported onto 5.7.14; fixed at 5.7.14.1-backpatch-00008 (backpatch-spring-security@bcf97e3). Servlet applications that log in with X.509 client certificates and configure no principal regex take the principal from the certificate's CN attribute itself (CVE-2026-47838). Where another attribute's value contains CN=, the principal is now the CN rather than that value: an OU of \"CN=duke,\" gave duke for a certificate whose CN is luke, and now gives luke. A CN that contains a comma or a quote is returned whole: Taylor, Luke where 5.7.14 gave \"Taylor."
  - cve: CVE-2026-22746
    upstream_fix_url: https://github.com/spring-projects/spring-security/commit/a317a3d8663995daa2bc91593bb88ae2da21ea52
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-22746
