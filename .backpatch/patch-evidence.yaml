  - cve: CVE-2026-41003
    upstream_fix_url: https://github.com/advisories/GHSA-3pjj-qpw6-5fcm
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-41003
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-spring-security/commit/ac58574
    basis: adapted
    artifacts:
      - org.springframework.security:spring-security-web
      - org.springframework.security:spring-security-saml2-service-provider
    note: "New in this release; ported onto 5.7.14; fixed at 5.7.14.1-backpatch-00010 (backpatch-spring-security@ac58574). Spring Security now writes the auto-submitting page for the SAML 2.0 POST binding (AuthnRequest, LogoutRequest and LogoutResponse) with `FormPostRedirectStrategy`, which escapes the form action and submits the form from a script allowed by its own `Content-Security-Policy: script-src 'nonce-...'` header (CVE-2026-41003). If a proxy, servlet filter or container adds a second `Content-Security-Policy` header to that response whose `script-src` does not allow that script, the browser blocks it and the user is left on a blank page; tests that match the old `<body onload=\"document.forms[0].submit()\">` markup no longer find it. Exempt the SAML endpoints from the extra header, or use the redirect binding through `singleSignOnServiceBinding(Saml2MessageBinding.REDIRECT)` and `singleLogoutServiceBinding(Saml2MessageBinding.REDIRECT)` where your identity provider supports it, and match tests on the new `<form id=\"redirect-form\" method=\"POST\" ...>`."
